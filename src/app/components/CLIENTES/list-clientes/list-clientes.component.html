<div class="scroll">
  <app-navbar></app-navbar>
  <app-progress-bar *ngIf="loading"></app-progress-bar>
  <div *ngIf="!loading" class="container">
    <div class="title">
      <h4>Listado de Clientes</h4>
      <div class="button-group">
        <button type="button" class="btn btn-dark" [routerLink]="['/listclientes/add']">Agregar Cliente</button>
        <button type="button" class="btn btn-danger" [routerLink]="['/main-menu-admin']">VOLVER</button>
      </div>
    </div>

    <!-- Filtros de búsqueda -->
    <div class="row mb-3">
      <div class="col-md-4">
        <label for="filtroId" class="form-label">Buscar por ID</label>
        <input id="filtroId" type="text" class="form-control" [(ngModel)]="filtroId" placeholder="Ingrese ID">
      </div>
      <div class="col-md-4">
        <label for="filtroNombre" class="form-label">Buscar por Nombre</label>
        <input id="filtroNombre" type="text" class="form-control" [(ngModel)]="filtroNombre" placeholder="Ingrese nombre">
      </div>
      <div class="col-md-4">
        <label for="filtroDireccion" class="form-label">Buscar por Dirección</label>
        <input id="filtroDireccion" type="text" class="form-control" [(ngModel)]="filtroDireccion" placeholder="Ingrese dirección">
      </div>
    </div>

    <table *ngIf="clientesFiltrados.length > 0" class="table table-hover">
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Nombre</th>
          <th scope="col">Apellido</th>
          <th scope="col">Teléfono</th>
          <th scope="col">Email</th>
          <th scope="col">Dirección</th>
          <th scope="col" class="actions-col">Acciones</th>
        </tr>
      </thead>
      <tbody>
  <tr *ngFor="let item of clientesFiltrados" class="table-dark">
          <td data-label="ID">{{ item.idCliente }}</td>
          <td data-label="Nombre">{{ item.nombre }}</td>
          <td data-label="Apellido">{{ item.apellido }}</td>
          <td data-label="Teléfono">{{ item.telefono }}</td>
          <td data-label="Email">{{ item.email }}</td>
          <td data-label="Dirección">{{ item.direccion }}</td>
          <td data-label="Acciones" class="actions-cell">
            <div class="button-container">
              <button [routerLink]="['/listclientes/edit/', item.idCliente]" type="button" class="btn btn-action btn-info">
                <i class="fas fa-pen"></i> Editar
              </button>
              <button (click)="confirmDeleteCliente(item.idCliente!)" type="button" class="btn btn-action btn-danger">
                <i class="fas fa-trash"></i> Eliminar
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <h5 *ngIf="listCliente.length == 0">No hay Clientes disponibles en este momento</h5>
  </div>
</div>
